experiment:
  name: cswin_scratch_v3


model:
  name: CSWin_64_24322_small_256
  num_classes: 1
  pretrained: false
  checkpoint: null
  drop_rate: 0.1 # Paper Section 3.1: Dropout rate between 0.5 and 0.1 to prevent overfitting
  drop_path_rate: 0.1 # Stochastic depth regularization for Transformer blocks


data:
  manifest: data/manifests/author_data.csv
  root: data/Dataset-1
  image_size: 256 # Paper Section 2.1: All images sized at 256 x 256 pixels

  train_subsets:
    - Data Set 1
    - Data Set 2
    - Data Set 3
    - Data Set 4

  val_subsets:
    - Data Set 1
    - Data Set 2
    - Data Set 3
    - Data Set 4

  test_subsets:
    dataset_all:
      - Data Set 1
      - Data Set 2
      - Data Set 3
      - Data Set 4
    dataset_1:
      - Data Set 1
    dataset_2:
      - Data Set 2
    dataset_3:
      - Data Set 3
    dataset_4:
      - Data Set 4


training:
  epochs: 20
  batch_size: 32
  val_batch_size: 64
  num_workers: 4
  optimizer: AdamW # Decoupled weight decay for Vision Transformers
  learning_rate: 0.00001
  weight_decay: 0.05 # Decoupled weight decay for AdamW
  warmup_epochs: 0 # 2-epoch linear warmup for stable scratch training
  grad_clip: 1.0 # Gradient clipping to prevent AMP gradient spikes
  loss: BCEWithLogitsLoss # Paper Section 3.1: Binary Cross-Entropy Loss
  scheduler: cosine # Cosine annealing schedule after warmup
  save_every: 0 # Snapshots every N epochs (0 = only best.pth and last.pth)


hardware:
  device: cuda


resume:
  enabled: true # Set to true to resume training from an existing 256x256 checkpoint
  checkpoint: experiments/checkpoints/cswin_scratch_v3/last.pth
  weights_only: true # Set to true to load model weights only and restart optimizer with fresh learning rate


logging:
  verbose: false


paths:
  checkpoint_dir: experiments/checkpoints
  log_dir: experiments/logs
  result_dir: experiments/results